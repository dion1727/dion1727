<text x="36" y="82" fill="#f4f8ff" font-family="Arial" font-size="34" font-weight="700">A cleaner activity section with a proper interface.</text>
<g>
<rect x="38" y="106" width="350" height="64" rx="18" fill="#0b1322" stroke="#8aa0be" stroke-opacity=".25"/>
