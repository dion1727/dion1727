<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" width="1200" height="210">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#06070a"/><stop offset="55%" stop-color="#0b1020"/><stop offset="100%" stop-color="#06070a"/></linearGradient>
<linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#9cb0d0" stop-opacity=".18"/><stop offset="50%" stop-color="#d7e1f2" stop-opacity=".4"/><stop offset="100%" stop-color="#9cb0d0" stop-opacity=".08"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#8ef2e1"/><stop offset="100%" stop-color="#8db6ff"/></linearGradient>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="30"/></filter>
<filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<rect width="1200" height="210" rx="28" fill="url(#bg)"/>
<rect x="12" y="12" width="1176" height="186" rx="22" fill="#ffffff" fill-opacity=".028" stroke="url(#line)"/>
