<text x="36" y="48" fill="#90a6c5" font-family="monospace" font-size="13" letter-spacing="1.4">ABOUT / DEVELOPER PROFILE</text>
<text x="36" y="92" fill="#f5f9ff" font-family="Arial,Helvetica,sans-serif" font-size="50" font-weight="700">Hey, I'm Dion.</text>
<text x="38" y="126" fill="#dbe3f0" font-family="Arial,Helvetica,sans-serif" font-size="21">I’m Dion Agung Kadang, an Informatics student who enjoys building useful software,</text>
<text x="38" y="152" fill="#dbe3f0" font-family="Arial,Helvetica,sans-serif" font-size="21">clean interfaces, backend services, and small interactive experiments.</text>
<text x="38" y="192" fill="#afbbcf" font-family="Arial,Helvetica,sans-serif" font-size="18">Learning by building • Improving UI/UX • Open-source minded • Practical problem solving</text>
<rect x="760" y="52" width="382" height="150" rx="22" fill="#0b1322" stroke="#83a6d8" stroke-opacity=".35"/>
<text x="785" y="86" fill="#89eedc" font-family="monospace" font-size="15">const profile = {</text>
<text x="811" y="118" fill="#eaf2ff" font-family="monospace" font-size="16">name: 'Dion Agung Kadang',</text>
<text x="811" y="145" fill="#eaf2ff" font-family="monospace" font-size="16">focus: 'Web development',</text>
<text x="811" y="172" fill="#eaf2ff" font-family="monospace" font-size="16">mode: 'Build / Learn / Improve'</text>
<text x="785" y="196" fill="#89eedc" font-family="monospace" font-size="15">}</text>
