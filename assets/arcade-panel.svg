<text x="36" y="50" fill="#90a6c5" font-family="monospace" font-size="13" letter-spacing="1.4">INTERACTIVE ARCADE / LIVE WEBSITE</text>
<text x="36" y="88" fill="#f4f8ff" font-family="Arial" font-size="34" font-weight="700">The games are playable on the website — not just a screenshot.</text>
<text x="36" y="118" fill="#c3d0e0" font-family="Arial" font-size="19">Commit Quest uses contribution-style items, Pixel Snake grows with keyboard or touch controls,</text>
<text x="36" y="144" fill="#c3d0e0" font-family="Arial" font-size="19">and Commit Breaker turns your coding break into a mini arcade session.</text>
