<linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#9cb0d0" stop-opacity=".18"/><stop offset="50%" stop-color="#d7e1f2" stop-opacity=".4"/><stop offset="100%" stop-color="#9cb0d0" stop-opacity=".08"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#8ef2e1"/><stop offset="100%" stop-color="#8db6ff"/></linearGradient>
