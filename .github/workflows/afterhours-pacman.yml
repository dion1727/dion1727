name: After Hours - Animated contribution games
on:
  workflow_dispatch:
  schedule:
    - cron: '31 2 * * *'
permissions:
  contents: write
concurrency:
  group: afterhours-contribution-arcade
  cancel-in-progress: false
jobs:
  animate:
    if: github.repository == 'dion1727/dion1727'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Generate animated Pac-Man and Breakout from genuine Github graph
        uses: abozanona/pacman-contribution-graph@7332e1de7903ab780c3692a4127a59cc13872daa
        with:
          github_user_name: dion1727
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: pacman,breakout
          player_style: opportunistic
          hide_month_labels: 'false'
      - name: Publish game animations to separate branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: arcade-output
          build_dir: dist
          commit_message: 'chore: refresh animated GitHub contribution games'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
