name: Sync actual GitHub contributions

on:
  schedule:
    - cron: '19 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dion-profile-calendar
  cancel-in-progress: false

jobs:
  calendar:
    if: github.repository == 'dion1727/dion1727'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout profile
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Generate actual contribution data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync_calendar.py
      - name: Save updated calendar only if the data changed
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/contributions.json
          if git diff --cached --quiet; then
            echo 'No contribution change, no commit.'
          else
            git commit -m 'chore: sync actual contribution calendar [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
