name: After Hours - Sync real contribution calendar
on:
  workflow_dispatch:
  schedule:
    - cron: '11 * * * *'
permissions:
  contents: write
concurrency:
  group: afterhours-real-calendar
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'dion1727/dion1727'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source without modifying main
        uses: actions/checkout@v4
      - name: Get genuine contribution counts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync_calendar.py
      - name: Publish data to isolated arcade-data branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: arcade-data
          build_dir: docs/data
          commit_message: 'chore: refresh public contribution calendar'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
