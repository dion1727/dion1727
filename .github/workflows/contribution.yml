name: Update contribution arcade

on:
  workflow_dispatch:
  schedule:
    - cron: '41 1 * * *'

permissions:
  contents: write

jobs:
  arcade:
    if: github.repository == 'dion1727/dion1727'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Generate SVG from the actual GitHub contribution calendar
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: dion1727
          outputs: |
            dist/live-contribution.svg?palette=github-dark
      - name: Publish real animation to README
        shell: bash
        run: |
          set -e
          test -s dist/live-contribution.svg
          cp dist/live-contribution.svg assets/live-contribution.svg
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/live-contribution.svg
          if git diff --cached --quiet; then
            echo 'Animation unchanged.'
          else
            git commit -m 'chore: update real contribution animation [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
